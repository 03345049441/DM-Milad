    .btn-primary { background: #15803d; color: #fff; width: 100%; padding: 10px; font-size: 14px; }

    function todayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseDateParts(raw) {
      if (!raw) return null;
      const str = String(raw).trim();

      let m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = m[2].padStart(2, "0");
        const dd = m[3].padStart(2, "0");
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      m = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        const yyyy = m[3];
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      return null;
    }

    window.formatPurposeLabel = (rawPurpose) => {
      if (!rawPurpose) return "-";
      const lang = window.appState.lang || "ur";
      const val = String(rawPurpose).trim();
      const matched = FUND_PURPOSES.find(
        (p) => p.id === val || p.ur === val || p.en.toLowerCase() === val.toLowerCase()
      );
      if (matched) return matched[lang] || matched.ur;
      return val;
    };

      const matchedExisting = FUND_PURPOSES.find(
        (p) => p.id === selTrim || p.ur === selTrim || p.en.toLowerCase() === selTrim.toLowerCase()
      );

      FUND_PURPOSES.forEach((p) => {
        const isSelected = matchedExisting && matchedExisting.id === p.id ? " selected" : "";
        const label = p[lang] || p.ur;
        parts.push(`<option value="${p.id}"${isSelected}>${label}</option>`);
      });

      if (selTrim && !matchedExisting) {
        const escaped = selTrim.replace(/"/g, "&quot;");
        parts.push(`<option value="${escaped}" selected>${selTrim}</option>`);
      }

      return parts.join("");
    };

      let purpose = f.purpose || "";

      if (!rawDate && f.note) {
        const parsedNoteDate = parseDateParts(f.note);
        if (parsedNoteDate) {
          rawDate = f.note;
        } else if (!purpose) {
          purpose = f.note;
        }
      }

      const parsed = parseDateParts(rawDate);
      return {
        ...f,
        date: parsed ? parsed.iso : rawDate,
        purpose,
        _ts: parsed ? parsed.ts : 0
      };
    };

      }
      return rawDate ? `<span dir="ltr">${rawDate}</span>` : `<span dir="ltr">-</span>`;

      if (item && item.createdAt && typeof item.createdAt.toMillis === "function") {

      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
