    .btn-primary { background: #15803d; color: #fff; width: 100%; padding: 10px; font-size: 14px; }

    .btn-edit { background: #0369a1; color: #fff; }
    .btn-approve { background: #15803d; color: #fff; flex: 1; }
    .btn-reject { background: #b91c1c; color: #fff; flex: 1; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 9px; border: 1px solid #15803d; background: #fff; color: #15803d; border-radius: 7px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #15803d; color: #fff; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; background: #fff; }
    .date-ltr { direction: ltr; text-align: left; }
    .date-preview { margin-top: 4px; font-size: 12px; color: #166534; font-weight: bold; direction: rtl; }
    .msg { margin-top: 10px; padding: 10px; border-radius: 7px; font-size: 13px; display: none; }
    .msg.error { display: block; background: #fee2e2; color: #991b1b; }
    .msg.success { display: block; background: #dcfce7; color: #166534; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
    .menu-btn { padding: 11px 8px; border: 1px solid #bbf7d0; background: #f0fdf4; color: #14532d; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; }
    .menu-btn.active { background: #15803d; color: #fff; border-color: #15803d; }
    .item-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #f8fafc; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .item-box img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin-top: 8px; }
    .img-fallback { margin-top: 6px; padding: 8px; background: #fef3c7; color: #92400e; border-radius: 6px; font-size: 12px; }

<body class="no-select">
  <div class="container">
    <div id="authCard" class="card">
      <div class="top-bar">
        <h2 id="appTitle">میلاد کمیٹی ڈھوک میکن</h2>
        <button type="button" id="langBtn" class="btn btn-secondary">English</button>
      </div>

      <div class="tabs">
        <button type="button" id="tabLogin" class="tab-btn active">لاگ ان</button>
        <button type="button" id="tabRegister" class="tab-btn">نیا اکاؤنٹ</button>
      </div>

      <div id="loginBox">
        <div class="field">
          <label id="lblLoginPhone" for="loginPhone">فون نمبر</label>
          <input id="loginPhone" type="tel" placeholder="03345049441" />
        </div>
        <div class="field">
          <label id="lblLoginPass" for="loginPass">پاس ورڈ</label>
          <input id="loginPass" type="password" placeholder="پاس ورڈ" />
        </div>
        <div id="multiAccountPicker" class="field" style="display:none;">
          <label id="lblSelectAccountRole" for="loginAccountSelect">اکاؤنٹ منتخب کریں</label>
          <select id="loginAccountSelect"></select>
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary">لاگ ان کریں</button>
      </div>

      <form id="registerForm" style="display:none;" novalidate>
        <div class="field">
          <label id="lblRegName" for="regName">پورا نام</label>
          <input id="regName" type="text" placeholder="پورا نام" />
        </div>
        <div class="field">
          <label id="lblRegPhone" for="regPhone">فون نمبر</label>
          <input id="regPhone" type="tel" placeholder="03001234567" />
        </div>
        <div class="field">
          <label id="lblRegPass" for="regPass">پاس ورڈ</label>
          <input id="regPass" type="password" placeholder="کم از کم 6 حروف" />
        </div>
        <div class="field">
          <label id="lblRegRole" for="regRole">اکاؤنٹ کی قسم</label>
          <select id="regRole">
            <option id="optRoleSelect" value="">منتخب کریں</option>
            <option id="optRolePublic" value="public">عام عوام (Public)</option>
            <option id="optRoleMgmt" value="management">انتظامیہ (Management - ایڈمن منظوری درکار)</option>
            <option id="optRoleAbroad" value="abroad">بیرونِ ملک (Abroad - ایڈمن منظوری درکار)</option>
          </select>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary">اکاؤنٹ بنائیں</button>
      </form>

      <div id="authMsg" class="msg"></div>
    </div>

            <div id="adminFundsTableWrap"></div>
          </div>
        </div>

        <div class="admin-section">
          <h4 id="admH3">3. اخراجات کی تصویر شامل کریں</h4>

            <label id="lblExpDate">تاریخ منتخب کریں (دن / مہینہ / سال)</label>
            <input id="expenseDate" type="date" class="date-ltr" />
            <div id="expenseDatePreview" class="date-preview"></div>
          </div>
          <div class="field">
            <label id="lblExpTitle">عنوان</label>
            <input id="expenseTitle" type="text" placeholder="عنوان" />
          </div>
          <div class="field">

            <input id="expenseUrl" type="text" placeholder="https://..." />
            <input id="expenseFile" type="file" accept="image/*" style="margin-top:6px;" />
          </div>
          <button type="button" id="addExpenseBtn" class="btn btn-primary">اخراجات کی تصویر محفوظ کریں</button>
        </div>

        <div class="admin-section">

            <label id="lblMediaCat">سیکشن منتخب کریں</label>
            <select id="mediaCategory">

          <div class="field">

            <input id="mediaDate" type="date" class="date-ltr" />
            <div id="mediaDatePreview" class="date-preview"></div>
          </div>
          <div class="field">
            <label id="lblMediaTitle">عنوان</label>

          <div class="field">

            <input id="mediaUrl" type="text" placeholder="https://..." />
            <input id="mediaFile" type="file" accept="image/*" style="margin-top:6px;" />
          </div>
          <button type="button" id="addMediaBtn" class="btn btn-primary">محفوظ کریں</button>
        </div>

        <div id="adminMsg" class="msg"></div>
      </div>
    </div>

    window.applySelectionRestriction = () => {
      const isAdmin = Boolean(window.appState.currentUser && window.appState.currentUser.role === "admin");
      document.body.classList.toggle("admin-select", isAdmin);
      document.body.classList.toggle("no-select", !isAdmin);
    };

    document.addEventListener("contextmenu", (e) => {
      if (!window.appState.currentUser || window.appState.currentUser.role !== "admin") {
        e.preventDefault();

    });

      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseDateParts(raw) {
      if (!raw) return null;
      const str = String(raw).trim();

      let m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = m[2].padStart(2, "0");
        const dd = m[3].padStart(2, "0");
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      m = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        const yyyy = m[3];
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      return null;
    }

    window.normalizeFundRecord = (f) => {
      let rawDate = f.date || "";
      let purpose = f.purpose || "";

      if (!rawDate && f.note) {
        const parsedNoteDate = parseDateParts(f.note);
        if (parsedNoteDate) {
          rawDate = f.note;
        } else if (!purpose) {
          purpose = f.note;
        }
      }

      const parsed = parseDateParts(rawDate);
      return {
        ...f,
        date: parsed ? parsed.iso : rawDate,
        purpose,
        _ts: parsed ? parsed.ts : 0
      };
    };

    window.formatDDMMYYYY = (rawDate) => {
      const p = parseDateParts(rawDate);
      if (p) {
        return `<span dir="ltr">${p.dd}/${p.mm}/${p.yyyy}</span>`;
      }
      return rawDate ? `<span dir="ltr">${rawDate}</span>` : `<span dir="ltr">-</span>`;
    };

    window.dateSortValue = (item) => {
      if (typeof item._ts === "number" && item._ts > 0) return item._ts;
      const p = parseDateParts(item && (item.date || item.folder));
      if (p && !Number.isNaN(p.ts)) return p.ts;
      if (item && item.createdAt && typeof item.createdAt.toMillis === "function") {
        return item.createdAt.toMillis();
      }
      return 0;
    };

      const driveMatch = u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch && driveMatch[1]) {

      return u;
    };
