    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 9px; border: 1px solid #15803d; background: #fff; color: #15803d; border-radius: 8px; font-weight: bold; cursor: pointer; }

    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }

    function todayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseDateParts(raw) {
      if (!raw) return null;
      const str = String(raw).trim();

      let m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = m[2].padStart(2, "0");
        const dd = m[3].padStart(2, "0");
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      m = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        const yyyy = m[3];
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      return null;
    }

    window.formatPurposeLabel = (rawPurpose) => {
      if (!rawPurpose) return "-";
      const lang = window.appState.lang || "ur";
      const val = String(rawPurpose).trim();
      const matched = FUND_PURPOSES.find(
        (p) => p.id === val || p.ur === val || p.en.toLowerCase() === val.toLowerCase()

      const matchedExisting = FUND_PURPOSES.find(

      FUND_PURPOSES.forEach((p) => {

      if (selTrim && !matchedExisting) {

      return parts.join("");

      if (!rawDate && f.note) {
        const parsedNoteDate = parseDateParts(f.note);
        if (parsedNoteDate) {
          rawDate = f.note;
        } else if (!purpose) {
          purpose = f.note;

      }

      const parsed = parseDateParts(rawDate);
      return {

        date: parsed ? parsed.iso : rawDate,
        purpose,
        _ts: parsed ? parsed.ts : 0
      };

      return rawDate ? `<span dir="ltr">${rawDate}</span>` : `<span dir="ltr">-</span>`;

      if (p && !Number.isNaN(p.ts)) return p.ts;
      if (item && item.createdAt && typeof item.createdAt.toMillis === "function") {

      const results = [];
      const seenIds = new Set();

      const qSnap = await getDocs(query(collection(db, "users"), where("phone", "==", phone)));
      qSnap.forEach((d) => {
        if (!seenIds.has(d.id)) {
          seenIds.add(d.id);
          results.push({ id: d.id, ...d.data() });

      });

      const legacySnap = await getDoc(doc(db, "users", phone));
      if (legacySnap.exists() && !seenIds.has(legacySnap.id)) {
        seenIds.add(legacySnap.id);
        results.push({ id: legacySnap.id, ...legacySnap.data() });

      const snap = await getDocs(query(collection(db, "users"), where("status", "==", "pending_approval")));
      if (snap.empty) {
        area.innerHTML = `<h4>${window.t("admH1")}</h4><div class='item-box'>${window.t("noPending")}</div>`;
        return;
      }

      area.innerHTML = `<h4>${window.t("admH1")}</h4><div id="pendingRequestsList"></div>`;
      const box = el("pendingRequestsList");

      snap.forEach((d) => {
        const u = d.data();
        const div = document.createElement("div");
        div.className = "item-box";
        div.innerHTML = `
          <div><strong>${u.name}</strong> (${u.phone})</div>
          <div style="font-size:12px;">${u.role === "abroad" ? window.t("roleAbroadLabel") : window.t("roleMgmtLabel")}</div>
          <div class="req-actions">
            <button type="button" class="btn btn-approve" data-id="${d.id}">${window.t("approveBtn")}</button>
            <button type="button" class="btn btn-reject" data-id="${d.id}">${window.t("rejectBtn")}</button>
          </div>`;
        box.appendChild(div);
      });

      box.querySelectorAll(".btn-approve").forEach((b) => {
        b.addEventListener("click", async () => {
          await updateDoc(doc(db, "users", b.dataset.id), { status: "active" });
          await renderApprovalsSection(area);
        });
      });

      box.querySelectorAll(".btn-reject").forEach((b) => {
        b.addEventListener("click", async () => {
          await updateDoc(doc(db, "users", b.dataset.id), { status: "rejected" });
          await renderApprovalsSection(area);
        });
      });
    }

    async function populateMemberDropdown() {
      const sel = el("fundMemberSelect");
      if (!db || !sel) return;
      const snap = await getDocs(collection(db, "users"));
      sel.innerHTML = "";
      memberNamesMap = {};
      snap.forEach((d) => {
        const u = d.data();
        memberNamesMap[u.phone] = u.name;
        if (u.role === "management" && u.status === "active") {
          const opt = document.createElement("option");
          opt.value = u.phone;
          opt.textContent = `${u.name} (${u.phone})`;
          sel.appendChild(opt);
        }
      });
    }

    async function renderFundsAndMembersDetails(area) {
      const usersSnap = await getDocs(collection(db, "users"));
      memberNamesMap = {};
      const allMembers = [];
      usersSnap.forEach((d) => {
        const u = d.data();
        memberNamesMap[u.phone] = u.name;
        if (u.phone !== BUILT_IN_ADMIN.phone) {
          allMembers.push({ id: d.id, ...u });
        }
      });

      const mgmtList = allMembers.filter((m) => m.role === "management");
      const abroadList = allMembers.filter((m) => m.role === "abroad");
      const publicList = allMembers.filter((m) => m.role === "public");

      const validGroups = ["management", "abroad", "public"];
      if (!validGroups.includes(window.appState.activeMemberGroup)) {
        window.appState.activeMemberGroup = "management";
      }

      const activeGroup = window.appState.activeMemberGroup;
      const groupMembers = activeGroup === "abroad"
        ? abroadList
        : activeGroup === "public"
          ? publicList
          : mgmtList;

      const fundsSnap = await getDocs(collection(db, "funds"));
      const fundItems = [];
      fundsSnap.forEach((d) => fundItems.push(window.normalizeFundRecord({ id: d.id, ...d.data() })));
      fundItems.sort((a, b) => window.dateSortValue(b) - window.dateSortValue(a));

      const fundsHtml = !fundItems.length
        ? `<div class='item-box'>${window.t("noFunds")}</div>`
        : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>${window.t("colDate")}</th>
                  <th>${window.t("colMember")}</th>
                  <th>${window.t("colAmount")}</th>
                  <th>${window.t("colPurpose")}</th>
                  <th>${window.t("colActions")}</th>
                </tr>
              </thead>
              <tbody>
                ${fundItems.map((f) => {
                  const mName = memberNamesMap[f.memberPhone] || f.memberPhone || "-";
                  return `
                    <tr>
                      <td>${window.formatDDMMYYYY(f.date)}</td>
                      <td>${mName}</td>
                      <td>${Number(f.amount || 0)}</td>
                      <td>${window.formatPurposeLabel(f.purpose)}</td>
                      <td>
                        <div class="row-actions" style="margin-top:0;">
                          <button type="button" class="btn btn-sm btn-edit" data-edit-id="${f.id}">${window.t("editBtn")}</button>
                          <button type="button" class="btn btn-sm btn-danger" data-del-id="${f.id}">${window.t("deleteBtn")}</button>
                        </div>
                      </td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
          <div id="fundEditPanel" class="edit-box" style="display:none;"></div>`;

      const roleText = (r) => r === "abroad"
        ? window.t("roleAbroadLabel")
        : r === "management"
          ? window.t("roleMgmtLabel")
          : window.t("rolePublicLabel");

      const statusText = (s) => s === "active"
        ? window.t("statusActive")
        : s === "pending_approval"
          ? window.t("statusPending")
          : window.t("statusRejected");

      const membersTableHtml = !groupMembers.length
        ? `<div class='item-box'>${window.t("noMembersFound")}</div>`
        : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>${window.t("colMember")}</th>
                  <th>${window.t("colPhone")}</th>
                  <th>${window.t("colRole")}</th>
                  <th>${window.t("colStatus")}</th>
                  <th>${window.t("colActions")}</th>
                </tr>
              </thead>
              <tbody>
                ${groupMembers.map((m) => `
                  <tr>
                    <td><strong>${m.name || "-"}</strong></td>
                    <td dir="ltr">${m.phone || "-"}</td>
                    <td>${roleText(m.role)}</td>
                    <td>${statusText(m.status)}</td>
                    <td>
                      <button type="button" class="btn btn-sm btn-danger" data-remove-user-id="${m.id}" data-remove-user-name="${(m.name || m.phone || "").replace(/"/g, "&quot;")}">${window.t("removeMemberBtn")}</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;

      area.innerHTML = `
        <div>
          <h4>${window.t("admFundsTableTitle")}</h4>
          ${fundsHtml}
        </div>
        <div class="sub-section">
          <h4>${window.t("admH5", { count: allMembers.length })}</h4>
          <div class="sub-tabs">
            <button type="button" class="sub-tab-btn ${activeGroup === "management" ? "active" : ""}" data-member-group="management">${window.t("subTabMgmt", { count: mgmtList.length })}</button>
            <button type="button" class="sub-tab-btn ${activeGroup === "abroad" ? "active" : ""}" data-member-group="abroad">${window.t("subTabAbroad", { count: abroadList.length })}</button>
            <button type="button" class="sub-tab-btn ${activeGroup === "public" ? "active" : ""}" data-member-group="public">${window.t("subTabPublic", { count: publicList.length })}</button>
          </div>
          ${membersTableHtml}
        </div>`;

      area.querySelectorAll("[data-member-group]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          window.appState.activeMemberGroup = btn.dataset.memberGroup;
          await renderFundsAndMembersDetails(area);
        });
      });

      area.querySelectorAll("[data-edit-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = fundItems.find((x) => x.id === btn.dataset.editId);
          if (!item) return;
          const panel = el("fundEditPanel");
          panel.style.display = "block";
          panel.innerHTML = `
            <div class="field">
              <label>${window.t("lblFundDate")}</label>
              <input id="editFundDate" type="date" class="date-ltr" value="${item.date || todayISO()}" />
            </div>
            <div class="field">
              <label>${window.t("lblFundAmount")}</label>
              <input id="editFundAmount" type="number" value="${Number(item.amount || 0)}" />
            </div>
            <div class="field">
              <label>${window.t("lblFundPurpose")}</label>
              <select id="editFundPurpose">${window.buildPurposeOptionsHtml(item.purpose || "", false)}</select>
            </div>
            <div class="row-actions">
              <button type="button" id="saveFundEditBtn" class="btn btn-sm btn-approve">${window.t("saveEditBtn")}</button>
              <button type="button" id="cancelFundEditBtn" class="btn btn-sm btn-secondary">${window.t("cancelEditBtn")}</button>
            </div>`;

          el("cancelFundEditBtn").addEventListener("click", () => {
            panel.style.display = "none";
          });

          el("saveFundEditBtn").addEventListener("click", async () => {
            const nextDate = el("editFundDate").value;
            const nextAmount = Number(el("editFundAmount").value);
            const nextPurpose = el("editFundPurpose").value.trim();
            if (!nextDate || !nextAmount) return;
            await updateDoc(doc(db, "funds", item.id), {
              date: nextDate,
              amount: nextAmount,
              purpose: nextPurpose
            });
            window.showAdminMsg(window.appState.lang === "en" ? "Fund updated." : "فنڈ کی انٹری اپ ڈیٹ ہو گئی۔", "success");
            await renderFundsAndMembersDetails(area);
          });
        });
      });

      area.querySelectorAll("[data-del-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(window.t("confirmDelete"))) return;
          await deleteDoc(doc(db, "funds", btn.dataset.delId));
          window.showAdminMsg(window.t("deletedMsg"), "success");
          await renderFundsAndMembersDetails(area);
        });
      });

      area.querySelectorAll("[data-remove-user-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userName = btn.dataset.removeUserName;
          if (!confirm(window.t("confirmRemoveMember", { name: userName }))) return;
          btn.disabled = true;
          try {
            await deleteDoc(doc(db, "users", btn.dataset.removeUserId));
            window.showAdminMsg(window.t("memberRemovedMsg"), "success");
            await populateMemberDropdown();
            await renderFundsAndMembersDetails(area);
          } catch (err) {
            btn.disabled = false;
            window.showAdminMsg(err && err.message ? err.message : "Error", "error");
          }
        });
      });
    }

    window.appState.handlers.bindSectionMediaAdd = (category) => {
      const btn = el("secAddMediaBtn");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        const l = window.appState.lang;
        if (!db) return;
        const date = el("secMediaDate").value;
        const title = el("secMediaTitle").value.trim();
        let src = el("secMediaUrl").value.trim();
        const fileInp = el("secMediaFile");
        const file = fileInp && fileInp.files ? fileInp.files[0] : null;
        if (file && category !== "videos") src = await fileToDataUrl(file);
        if (!date || !title || !src) {
          return window.showAdminMsg(l === "en" ? "Select date and enter title and link/photo." : "تاریخ منتخب کریں اور عنوان و لنک/تصویر درج کریں۔", "error");
        }

        await addDoc(collection(db, "media"), { category, date, title, src, createdAt: serverTimestamp() });
        el("secMediaTitle").value = "";
        el("secMediaUrl").value = "";
        if (fileInp) fileInp.value = "";
        window.showAdminMsg(l === "en" ? "Saved successfully." : "کامیابی سے محفوظ ہو گیا۔", "success");
        await window.appState.handlers.selectSection(category);
      });
    };

    window.appState.handlers.bindSectionExpenseAdd = () => {
      const btn = el("secAddExpBtn");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        const l = window.appState.lang;
        if (!db) return;
        const date = el("secExpDate").value;
        const title = el("secExpTitle").value.trim();
        let src = el("secExpUrl").value.trim();
        const file = el("secExpFile").files[0];
        if (file) src = await fileToDataUrl(file);
        if (!date || !title || !src) {
          return window.showAdminMsg(l === "en" ? "Select date and enter title and photo URL or file." : "تاریخ منتخب کریں اور عنوان و تصویر درج کریں۔", "error");
        }

        await addDoc(collection(db, "expenses"), { date, title, src, createdAt: serverTimestamp() });
        el("secExpTitle").value = "";
        el("secExpUrl").value = "";
        el("secExpFile").value = "";
        window.showAdminMsg(l === "en" ? "Expense photo saved." : "اخراجات کی تصویر محفوظ ہو گئی۔", "success");
        await window.appState.handlers.selectSection("expenses");
      });
    };

    window.appState.handlers.bindSectionFundAdd = () => {
      populateMemberDropdown().catch((e) => window.showAdminMsg(e.message, "error"));
      const btn = el("addFundBtn");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        const l = window.appState.lang;
        if (!db) return;
        const memberPhone = el("fundMemberSelect").value;
        const date = el("fundDate").value;
        const amount = Number(el("fundAmount").value);
        const purpose = el("fundPurpose").value.trim();

        if (!memberPhone || !date || !amount || !purpose) {
          return window.showAdminMsg(
            l === "en" ? "Select member, date, amount, and purpose." : "ممبر، تاریخ، رقم اور مقصد منتخب کریں۔",
            "error"
          );
        }

        await addDoc(collection(db, "funds"), {
          memberPhone,
          date,
          amount,
          purpose,
          createdAt: serverTimestamp()
        });
        el("fundAmount").value = "";
        el("fundPurpose").value = "";
        window.showAdminMsg(l === "en" ? "Fund record saved." : "فنڈ کی تفصیل محفوظ ہو گئی۔", "success");
        await renderFundsAndMembersDetails(el("contentArea"));
      });
    };

    window.appState.handlers.selectSection = async (sectionKey) => {
      const area = el("contentArea");
      area.innerHTML = `<div class='item-box'>${window.t("loading")}</div>`;
      if (!db) {
        area.innerHTML = `<div class='item-box'>${window.appState.lang === "en" ? "Database offline." : "ڈیٹا بیس دستیاب نہیں۔"}</div>`;
        return;
      }
      try {
        if (sectionKey === "funds") await renderMemberFunds(area);
        else if (sectionKey === "expenses") await renderImageList(area, "expenses", window.t("expensesTitle"));
        else if (sectionKey === "langar") await renderImageList(area, "langar", window.t("langarTitle"));
        else if (sectionKey === "photos") await renderMediaSorted(area, "photos", window.t("photosTitle"));
        else if (sectionKey === "videos") await renderMediaSorted(area, "videos", window.t("videosTitle"));
        else if (sectionKey === "funds_members") await renderFundsAndMembersDetails(area);
        else if (sectionKey === "approvals") await renderApprovalsSection(area);
      } catch (err) {
        area.innerHTML = `<div class='item-box'>${err && err.message ? err.message : "Error"}</div>`;
      }
    };

    window.appState.handlers.loginUser = async (phone, password, selectedDocId = "") => {
      const l = window.appState.lang;
      if (!db) return window.showAuthMsg(l === "en" ? "Database connection unavailable." : "ڈیٹا بیس سے رابطہ ممکن نہیں۔", "error");
      el("loginBtn").disabled = true;
      try {
        const accounts = await getAccountsForPhone(phone);
        if (!accounts.length) {
          return window.showAuthMsg(l === "en" ? "Account not found." : "اکاؤنٹ نہیں ملا۔", "error");
        }

        const matched = accounts.filter((acc) => acc.password === password);
        if (!matched.length) {
          return window.showAuthMsg(l === "en" ? "Incorrect password." : "پاس ورڈ غلط ہے۔", "error");
        }

        let targetUser = matched[0];
        if (matched.length > 1) {
          const chosen = matched.find((acc) => acc.id === selectedDocId);
          if (!chosen) {
            const picker = el("multiAccountPicker");
            const sel = el("loginAccountSelect");
            sel.innerHTML = matched.map((acc) => {
              const roleText = acc.role === "abroad"
                ? window.t("roleAbroadLabel")
                : acc.role === "management"
                  ? window.t("roleMgmtLabel")
                  : window.t("rolePublicLabel");
              return `<option value="${acc.id}">${roleText} - ${acc.name}</option>`;
            }).join("");
            picker.style.display = "block";
            return window.showAuthMsg(window.t("chooseAccountToLogin"), "error");
          }
          targetUser = chosen;
        }

        if ((targetUser.role === "management" || targetUser.role === "abroad") && targetUser.status === "pending_approval") {
          return window.showAuthMsg(l === "en" ? "Your account is awaiting Admin approval." : "آپ کا اکاؤنٹ ابھی ایڈمن کی منظوری کے منتظر ہے۔", "error");
        }
        if (targetUser.status === "rejected") {
          return window.showAuthMsg(l === "en" ? "Your account request was rejected." : "آپ کی اکاؤنٹ کی درخواست مسترد کر دی گئی ہے۔", "error");
        }

        window.appState.currentUser = targetUser;
        window.openPortal();
      } catch (err) {
        window.showAuthMsg(err && err.message ? err.message : "Error", "error");
      } finally {
        el("loginBtn").disabled = false;
      }
    };

    el("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const l = window.appState.lang;
      if (!db) return window.showAuthMsg(l === "en" ? "Database connection unavailable." : "ڈیٹا بیس سے رابطہ ممکن نہیں۔", "error");

      const name = el("regName").value.trim();
      const phone = window.normalizePhone(el("regPhone").value);
      const password = el("regPass").value;
      const role = el("regRole").value;

      if (!name) return window.showAuthMsg(l === "en" ? "Please enter your full name." : "براہِ کرم پورا نام لکھیں۔", "error");
      if (!window.isValidPhone(phone)) return window.showAuthMsg(l === "en" ? "Enter a valid phone number (e.g. 03001234567)." : "درست فون نمبر لکھیں (مثلاً 03001234567)۔", "error");
      if (phone === BUILT_IN_ADMIN.phone) return window.showAuthMsg(l === "en" ? "This number is reserved for Admin." : "یہ نمبر ایڈمن کے لیے محفوظ ہے۔", "error");
      if (password.length < 6) return window.showAuthMsg(l === "en" ? "Password must be at least 6 characters." : "پاس ورڈ کم از کم 6 حروف کا ہو۔", "error");
      if (!role) return window.showAuthMsg(l === "en" ? "Please select an account type." : "براہِ کرم اکاؤنٹ کی قسم منتخب کریں۔", "error");

      el("registerBtn").disabled = true;
      try {
        const existingAccounts = await getAccountsForPhone(phone);

        if (role === "public" && existingAccounts.length > 0) {
          return window.showAuthMsg(window.t("publicNotAllowedExisting"), "error");
        }

        if (existingAccounts.some((acc) => acc.role === role)) {
          return window.showAuthMsg(window.t("roleAlreadyExists"), "error");
        }

        const docId = `${phone}_${role}`;
        const ref = doc(db, "users", docId);
        const needsApproval = role === "management" || role === "abroad";

        await setDoc(ref, {
          name,
          phone,
          password,
          role,
          status: needsApproval ? "pending_approval" : "active",
          createdAt: serverTimestamp()
        });

        el("registerForm").reset();
        el("tabLogin").click();
        el("loginPhone").value = phone;
        el("multiAccountPicker").style.display = "none";
        window.showAuthMsg(
          needsApproval
            ? (l === "en" ? "Account created! You can log in after Admin approval." : "اکاؤنٹ بن گیا! ایڈمن کی منظوری کے بعد آپ لاگ ان کر سکیں گے۔")
            : (l === "en" ? "Public account created! You can log in now." : "عوام اکاؤنٹ بن گیا! اب آپ لاگ ان کر سکتے ہیں۔"),
          "success"
        );
      } catch (err) {
        window.showAuthMsg(err && err.message ? err.message : "Error", "error");
      } finally {
        el("registerBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
