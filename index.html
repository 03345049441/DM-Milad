async function renderFundsAndMembersDetails(area) {
  const usersSnap = await getDocs(collection(db, "users"));
  memberNamesMap = {};
  memberPhotosMap = {};
  const allMembers = [];
  usersSnap.forEach((d) => {
    const u = d.data();
    memberNamesMap[u.phone] = u.name;
    if (u.photoUrl) memberPhotosMap[u.phone] = u.photoUrl;
    if (u.phone !== BUILT_IN_ADMIN.phone) {
      allMembers.push({ id: d.id, ...u });
    }
  });
  allMembers.sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")));
  cachedAllMembers = allMembers;

  const fundsSnap = await getDocs(collection(db, "funds"));
  const allFundItems = [];
  const memberOptionsMap = new Map();
  allMembers.forEach((m) => {
    if (m.phone) {
      memberOptionsMap.set(m.phone, { phone: m.phone, name: m.name || m.phone });
    }
  });
  fundsSnap.forEach((d) => {
    const norm = window.normalizeFundRecord({ id: d.id, ...d.data() });
    const amt = Number(norm.amount || 0);
    const mKey = norm.memberPhone || "";
    const mName = memberNamesMap[mKey] || mKey || "-";
    if (mKey && !memberOptionsMap.has(mKey)) {
      memberOptionsMap.set(mKey, { phone: mKey, name: mName });
    }
    allFundItems.push({ ...norm, memberPhone: mKey, memberName: mName, amount: amt });
  });
  allFundItems.sort((a, b) => window.dateSortValue(b) - window.dateSortValue(a));
  cachedFundItems = allFundItems;
  cachedFundMemberOptions = Array.from(memberOptionsMap.values());

  const activeSubTab = window.appState.activeFundsMembersTab;
  const stickyButtonsHtml = `
    <div class="sticky-sub-nav">
      <button type="button" class="sticky-sub-btn ${activeSubTab === "funds" ? "active" : ""}" data-fm-tab="funds">${window.t("tabFundsDetailsBtn")}</button>
      <button type="button" class="sticky-sub-btn ${activeSubTab === "members" ? "active" : ""}" data-fm-tab="members">${window.t("tabRegisteredMembersBtn")}</button>
    </div>`;

  let bodyHtml = "";
  if (activeSubTab === "funds") {
    bodyHtml = `
      <div>
        <h4>${window.t("admFundsTableTitle")}</h4>
        <div class="filter-panel-box">
          <div class="filter-grid-2">
            <div class="field" style="margin-bottom:0;">
              <label for="fundsViewSearchInput">${window.t("lblFundSearch")}</label>
              <input id="fundsViewSearchInput" type="search" value="${String(window.appState.fundMemberSearchQuery || "").replace(/"/g, "&quot;")}" placeholder="${window.t("fundSearchPlaceholder")}" />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="fundsViewMemberSelect">${window.t("lblFundSelectFilter")}</label>
              <select id="fundsViewMemberSelect"></select>
            </div>
          </div>
        </div>
        <div id="fundsFilteredResultsHost"></div>
      </div>`;
  } else if (activeSubTab === "members") {
    bodyHtml = `
      <div>
        <h4>${window.t("admH5", { count: allMembers.length })}</h4>
        <div class="filter-panel-box">
          <div class="field" style="margin-bottom:0;">
            <label for="registeredMembersSearchInput">${window.t("lblMemberSearch")}</label>
            <input id="registeredMembersSearchInput" type="search" value="${String(window.appState.memberDirectorySearchQuery || "").replace(/"/g, "&quot;")}" placeholder="${window.t("memberSearchPlaceholder")}" />
          </div>
        </div>
        <div id="registeredMembersTableHost"></div>
      </div>`;
  }

  area.innerHTML = stickyButtonsHtml + bodyHtml;
  syncStickySubNavTop();

  area.querySelectorAll("[data-fm-tab]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      window.appState.activeFundsMembersTab = btn.dataset.fmTab;
      await renderFundsAndMembersDetails(area);
    });
  });

  if (activeSubTab === "funds") {
    refreshFundsFilterView(area);
    const viewSearchInp = el("fundsViewSearchInput");
    const viewMemberSel = el("fundsViewMemberSelect");
    if (viewSearchInp) {
      viewSearchInp.addEventListener("input", () => {
        window.appState.fundMemberSearchQuery = viewSearchInp.value;
        refreshFundsFilterView(area);
      });
    }
    if (viewMemberSel) {
      viewMemberSel.addEventListener("change", () => {
        window.appState.selectedFundMemberPhone = viewMemberSel.value;
        refreshFundsFilterView(area);
      });
    }
  } else if (activeSubTab === "members") {
    refreshMembersDirectoryTable(area);
    const memSearchInp = el("registeredMembersSearchInput");
    if (memSearchInp) {
      memSearchInp.addEventListener("input", () => {
        window.appState.memberDirectorySearchQuery = memSearchInp.value;
        refreshMembersDirectoryTable(area);
      });
    }
  }
