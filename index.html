    th, td { border: 1px solid #cbd5e1; padding: 7px; text-align: start; vertical-align: middle; }
    th { background: #f1f5f9; }
    .row-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .edit-box { background: #eff6ff; border: 1px solid #93c5fd; border-radius: 8px; padding: 10px; margin-top: 10px; }

      text-align: center;

    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 10px;
      touch-action: none;
    }
    .img-modal.open {
      display: flex;
    }
    .img-modal-box {
      position: relative;
      width: 100%;
      max-width: 98vw;
      max-height: 96vh;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      touch-action: none;

    .img-modal-viewport {
      overflow: auto;
      width: 100%;
      height: 76vh;
      max-height: 76vh;
      border-radius: 8px;
      background: #020617;
      touch-action: none;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .img-modal-box img {
      display: block;
      max-width: 100%;
      max-height: 74vh;
      width: auto;
      height: auto;
      border-radius: 6px;
      transform-origin: 50% 50%;
      transition: transform 0.08s ease-out;
      touch-action: none;
    }
    .img-modal-close {
      margin-top: 10px;
      align-self: center;

    const el = (id) => document.getElementById(id);

    let authMsgTimer = null;
    window.showAuthMsg = (text, type) => {
      const box = el("authMsg");
      if (!box) return;
      box.textContent = text;
      box.className = "msg " + type;
      if (authMsgTimer) clearTimeout(authMsgTimer);
      authMsgTimer = setTimeout(() => {
        box.className = "msg";
        box.textContent = "";
      }, 4500);
    };

    let adminMsgTimer = null;
    window.showAdminMsg = (text, type) => {
      const box = el("adminMsg");
      if (!box) return;
      box.textContent = text;
      box.className = "msg " + type;
      if (adminMsgTimer) clearTimeout(adminMsgTimer);
      adminMsgTimer = setTimeout(() => {
        box.className = "msg";
        box.textContent = "";
      }, 5000);
    };

    window.onerror = (msg, src, line) => {
      window.showAuthMsg(`Error: ${msg} (Line ${line || "?"})`, "error");
    };

    window.applySelectionRestriction = () => {
      const isAdmin = Boolean(window.appState.currentUser && window.appState.currentUser.role === "admin");
      document.body.classList.toggle("admin-select", isAdmin);
      document.body.classList.toggle("no-select", !isAdmin);
    };

    document.addEventListener("contextmenu", (e) => {
      if (!window.appState.currentUser || window.appState.currentUser.role !== "admin") {
        e.preventDefault();
      }
    });

    document.addEventListener("copy", (e) => {
      if (!window.appState.currentUser || window.appState.currentUser.role !== "admin") {
        e.preventDefault();

    });

    function todayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseDateParts(raw) {
      if (!raw) return null;
      const str = String(raw).trim();

      let m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = m[2].padStart(2, "0");
        const dd = m[3].padStart(2, "0");
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      m = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        const yyyy = m[3];
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      return null;
    }

      if (!rawPurpose) return "-";

      const val = String(rawPurpose).trim();

        (p) => p.id === val || p.ur === val || p.en.toLowerCase() === val.toLowerCase()
      );
      if (matched) return matched[lang] || matched.en;
      return val;
    };
