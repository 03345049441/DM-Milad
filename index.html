  <style>

    body.no-select { -webkit-user-select: none; user-select: none; }
    body.admin-select { -webkit-user-select: text; user-select: text; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { background: #fff; padding: 16px; border-radius: 14px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); margin-bottom: 14px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    h2, h3, h4 { margin: 0; color: #14532d; }
    h2 { font-size: 19px; }
    h3 { font-size: 16px; }
    h4 {
      font-size: 14px;
      margin-bottom: 10px;
      background: #dcfce7;
      color: #14532d;
      padding: 7px 11px;
      border-radius: 8px;
      border-left: 4px solid #15803d;
    }
    html[dir="rtl"] h4 {
      border-left: none;
      border-right: 4px solid #15803d;
    }
    .btn { padding: 7px 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
    .btn-primary { background: #15803d; color: #fff; width: 100%; padding: 10px; font-size: 14px; }
    .btn-bio { background: #0f766e; color: #fff; width: 100%; padding: 9px; font-size: 13px; margin-top: 8px; }
    .btn-pin { background: #1d4ed8; color: #fff; width: 100%; padding: 9px; font-size: 13px; margin-top: 8px; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-danger { background: #b91c1c; color: #fff; }
    .btn-edit { background: #0369a1; color: #fff; }
    .btn-approve { background: #15803d; color: #fff; flex: 1; }
    .btn-reject { background: #b91c1c; color: #fff; flex: 1; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 9px; border: 1px solid #15803d; background: #fff; color: #15803d; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #15803d; color: #fff; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; }
    .date-ltr { direction: ltr; text-align: left; }
    .date-preview { margin-top: 4px; font-size: 12px; color: #166534; font-weight: bold; direction: rtl; }
    .msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.error { display: block; background: #fee2e2; color: #991b1b; }
    .msg.success { display: block; background: #dcfce7; color: #166534; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin: 12px 0 14px; }
    .menu-btn { padding: 12px 10px; border: 1px solid #bbf7d0; background: #f0fdf4; color: #14532d; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; transition: 0.15s ease; }
    .menu-btn.active { background: #15803d; color: #fff; border-color: #15803d; box-shadow: 0 3px 8px rgba(21,128,61,0.22); }
    .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
    .sub-tab-btn { flex: 1; min-width: 90px; padding: 7px 9px; border: 1px solid #15803d; background: #f0fdf4; color: #14532d; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; }
    .sub-tab-btn.active { background: #15803d; color: #fff; }
    .entry-box { border: 1px solid #bbf7d0; background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    .pin-setup-box { border: 1px solid #bfdbfe; background: #eff6ff; border-radius: 10px; padding: 11px; margin-bottom: 12px; }
    .item-box { border: 1px solid #e2e8f0; border-radius: 10px; padding: 11px; margin-bottom: 8px; background: #f8fafc; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .item-box img { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin-top: 8px; cursor: pointer; }
    .img-fallback { margin-top: 6px; padding: 8px; background: #fef3c7; color: #92400e; border-radius: 6px; font-size: 12px; }
    .folder-tag { display: inline-block; background: #dcfce7; color: #166534; padding: 2px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .sub-section { border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 14px; }
    .req-actions { display: flex; gap: 8px; margin-top: 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #cbd5e1; padding: 7px; text-align: start; vertical-align: middle; }
    th { background: #f1f5f9; }
    .row-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .edit-box { background: #eff6ff; border: 1px solid #93c5fd; border-radius: 8px; padding: 10px; margin-top: 10px; }

      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #14532d;
      background: #dcfce7;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 10px;
      touch-action: none;
    }
    .img-modal.open {
      display: flex;
    }
    .img-modal-box {
      position: relative;
      width: 100%;
      max-width: 98vw;
      max-height: 96vh;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }
    .img-modal-viewport {
      overflow: hidden;
      width: 100%;
      height: 76vh;
      max-height: 76vh;
      border-radius: 8px;
      background: #020617;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .img-modal-box img {
      display: block;
      max-width: 100%;
      max-height: 74vh;
      width: auto;
      height: auto;
      border-radius: 6px;
      transform-origin: 50% 50%;
      transition: transform 0.04s linear;
      touch-action: none;
      will-change: transform;
    }
    .img-modal-close {
      margin-top: 10px;
      align-self: center;
    }

          <input id="loginPass" type="password" placeholder="Password" />
        </div>
        <div id="pinLoginField" class="field" style="display:none;">

        </div>
        <div id="multiAccountPicker" class="field" style="display:none;">
          <label id="lblSelectAccountRole" for="loginAccountSelect">Select Account</label>
          <select id="loginAccountSelect"></select>
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary">Login</button>
        <button type="button" id="bioLoginBtn" class="btn btn-bio">Fingerprint Login</button>
        <button type="button" id="pinLoginBtn" class="btn btn-pin">PIN Login</button>
      </div>

      <form id="registerForm" style="display:none;" novalidate>
        <div class="field">
          <label id="lblRegName" for="regName">Full Name</label>
          <input id="regName" type="text" placeholder="Full Name" />
        </div>
        <div class="field">
          <label id="lblRegPhone" for="regPhone">Phone Number</label>
          <input id="regPhone" type="tel" placeholder="03001234567" />
        </div>
        <div class="field">
          <label id="lblRegPass" for="regPass">Password</label>
          <input id="regPass" type="password" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label id="lblRegRole" for="regRole">Account Type</label>
          <select id="regRole">
            <option id="optRoleSelect" value="">Select Type</option>
            <option id="optRolePublic" value="public">Public</option>
            <option id="optRoleMgmt" value="management">Management (Admin approval required)</option>
            <option id="optRoleAbroad" value="abroad">Abroad (Admin approval required)</option>
          </select>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary">Create Account</button>
      </form>

      <div id="authMsg" class="msg"></div>
    </div>

    <div id="portalCard" class="card" style="display:none;">

      <div id="adminEntryArea" style="display:none;"></div>
      <div id="contentArea"></div>
      <div id="adminMsg" class="msg"></div>

    async function populateMemberDropdown() {

    async function renderFundsAndMembersDetails(area) {
      const usersSnap = await getDocs(collection(db, "users"));
      memberNamesMap = {};
      const allMembers = [];
      usersSnap.forEach((d) => {
        const u = d.data();
        memberNamesMap[u.phone] = u.name;
        if (u.phone !== BUILT_IN_ADMIN.phone) {
          allMembers.push({ id: d.id, ...u });
        }
      });

      const mgmtList = allMembers.filter((m) => m.role === "management");
      const abroadList = allMembers.filter((m) => m.role === "abroad");
      const publicList = allMembers.filter((m) => m.role === "public");

      const validGroups = ["management", "abroad", "public"];
      if (!validGroups.includes(window.appState.activeMemberGroup)) {
        window.appState.activeMemberGroup = "management";
      }

      const activeGroup = window.appState.activeMemberGroup;
      const groupMembers = activeGroup === "abroad"
        ? abroadList
        : activeGroup === "public"
          ? publicList
          : mgmtList;

      const fundsSnap = await getDocs(collection(db, "funds"));
      const fundItems = [];
      fundsSnap.forEach((d) => fundItems.push(window.normalizeFundRecord({ id: d.id, ...d.data() })));
      fundItems.sort((a, b) => window.dateSortValue(b) - window.dateSortValue(a));

      const fundsHtml = !fundItems.length
        ? `<div class='item-box'>${window.t("noFunds")}</div>`
        : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>${window.t("colDate")}</th>
                  <th>${window.t("colMember")}</th>
                  <th>${window.t("colAmount")}</th>
                  <th>${window.t("colPurpose")}</th>
                  <th>${window.t("colActions")}</th>
                </tr>
              </thead>
              <tbody>
                ${fundItems.map((f) => {
                  const mName = memberNamesMap[f.memberPhone] || f.memberPhone || "-";
                  return `
                    <tr>
                      <td>${window.formatDDMMYYYY(f.date)}</td>
                      <td>${mName}</td>
                      <td>${Number(f.amount || 0)}</td>
                      <td>${window.formatPurposeLabel(f.purpose)}</td>
                      <td>
                        <div class="row-actions" style="margin-top:0;">
                          <button type="button" class="btn btn-sm btn-edit" data-edit-id="${f.id}">${window.t("editBtn")}</button>
                          <button type="button" class="btn btn-sm btn-danger" data-del-id="${f.id}">${window.t("deleteBtn")}</button>
                        </div>
                      </td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
          <div id="fundEditPanel" class="edit-box" style="display:none;"></div>`;

      const roleText = (r) => r === "abroad"
        ? window.t("roleAbroadLabel")
        : r === "management"
          ? window.t("roleMgmtLabel")
          : window.t("rolePublicLabel");

      const statusText = (s) => s === "active"
        ? window.t("statusActive")
        : s === "pending_approval"
          ? window.t("statusPending")
          : window.t("statusRejected");

      const membersTableHtml = !groupMembers.length
        ? `<div class='item-box'>${window.t("noMembersFound")}</div>`
        : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>${window.t("colMember")}</th>
                  <th>${window.t("colPhone")}</th>
                  <th>${window.t("colRole")}</th>
                  <th>${window.t("colStatus")}</th>
                  <th>${window.t("colActions")}</th>
                </tr>
              </thead>
              <tbody>
                ${groupMembers.map((m) => `
                  <tr>
                    <td><strong>${m.name || "-"}</strong></td>
                    <td dir="ltr">${m.phone || "-"}</td>
                    <td>${roleText(m.role)}</td>
                    <td>${statusText(m.status)}</td>
                    <td>
                      <button type="button" class="btn btn-sm btn-danger" data-remove-user-id="${m.id}" data-remove-user-name="${(m.name || m.phone || "").replace(/"/g, "&quot;")}">${window.t("removeMemberBtn")}</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;

      area.innerHTML = `
        <div>
          <h4>${window.t("admFundsTableTitle")}</h4>
          ${fundsHtml}
        </div>
        <div class="sub-section">
          <h4>${window.t("admH5", { count: allMembers.length })}</h4>
          <div class="sub-tabs">
            <button type="button" class="sub-tab-btn ${activeGroup === "management" ? "active" : ""}" data-member-group="management">${window.t("subTabMgmt", { count: mgmtList.length })}</button>
            <button type="button" class="sub-tab-btn ${activeGroup === "abroad" ? "active" : ""}" data-member-group="abroad">${window.t("subTabAbroad", { count: abroadList.length })}</button>
            <button type="button" class="sub-tab-btn ${activeGroup === "public" ? "active" : ""}" data-member-group="public">${window.t("subTabPublic", { count: publicList.length })}</button>
          </div>
          ${membersTableHtml}
        </div>`;

      area.querySelectorAll("[data-member-group]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          window.appState.activeMemberGroup = btn.dataset.memberGroup;
          await renderFundsAndMembersDetails(area);
        });
      });

      area.querySelectorAll("[data-edit-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = fundItems.find((x) => x.id === btn.dataset.editId);
          if (!item) return;
          const panel = el("fundEditPanel");
          panel.style.display = "block";
          panel.innerHTML = `
            <div class="field">
              <label>${window.t("lblFundDate")}</label>
              <input id="editFundDate" type="date" class="date-ltr" value="${item.date || todayISO()}" />
            </div>
            <div class="field">
              <label>${window.t("lblFundAmount")}</label>
              <input id="editFundAmount" type="number" value="${Number(item.amount || 0)}" />
            </div>
            <div class="field">
              <label>${window.t("lblFundPurpose")}</label>
              <select id="editFundPurpose">${window.buildPurposeOptionsHtml(item.purpose || "", false)}</select>
            </div>
            <div class="row-actions">
              <button type="button" id="saveFundEditBtn" class="btn btn-sm btn-approve">${window.t("saveEditBtn")}</button>
              <button type="button" id="cancelFundEditBtn" class="btn btn-sm btn-secondary">${window.t("cancelEditBtn")}</button>
            </div>`;

          el("cancelFundEditBtn").addEventListener("click", () => {
            panel.style.display = "none";
          });

          el("saveFundEditBtn").addEventListener("click", async () => {
            const nextDate = el("editFundDate").value;
            const nextAmount = Number(el("editFundAmount").value);
            const nextPurpose = el("editFundPurpose").value.trim();
            if (!nextDate || !nextAmount) return;
            await updateDoc(doc(db, "funds", item.id), {
              date: nextDate,
              amount: nextAmount,
              purpose: nextPurpose
            });
            window.showAdminMsg(window.appState.lang === "en" ? "Fund updated." : "فنڈ کی انٹری اپ ڈیٹ ہو گئی۔", "success");
            await renderFundsAndMembersDetails(area);
          });
        });
      });

      area.querySelectorAll("[data-del-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(window.t("confirmDelete"))) return;
          await deleteDoc(doc(db, "funds", btn.dataset.delId));
          window.showAdminMsg(window.t("deletedMsg"), "success");
          await renderFundsAndMembersDetails(area);
        });
      });

      area.querySelectorAll("[data-remove-user-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userName = btn.dataset.removeUserName;
          if (!confirm(window.t("confirmRemoveMember", { name: userName }))) return;
          btn.disabled = true;
          try {
            await deleteDoc(doc(db, "users", btn.dataset.removeUserId));
            window.showAdminMsg(window.t("memberRemovedMsg"), "success");
            await populateMemberDropdown();
            await renderFundsAndMembersDetails(area);
          } catch (err) {
            btn.disabled = false;
            window.showAdminMsg(err && err.message ? err.message : "Error", "error");
          }
        });
      });
    }
