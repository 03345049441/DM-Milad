      overscroll-behavior-x: none;

    body { margin: 0; padding: 12px; background: #f1f5f9; color: #0f172a; line-height: 1.6; }
    body.no-select { -webkit-user-select: none; user-select: none; }
    body.admin-select { -webkit-user-select: text; user-select: text; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { background: #fff; padding: 16px; border-radius: 14px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); margin-bottom: 14px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .user-header-wrap { display: flex; align-items: center; gap: 10px; }
    .avatar-sm { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center center; border: 2px solid #15803d; background: #dcfce7; flex-shrink: 0; cursor: pointer; }
    .avatar-md { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; object-position: center center; border: 2px solid #15803d; background: #dcfce7; flex-shrink: 0; cursor: pointer; }
    h2, h3, h4 { margin: 0; color: #14532d; }
    h2 { font-size: 19px; }
    h3 { font-size: 16px; }
    h4 {
      font-size: 14px;
      margin-bottom: 10px;
      background: #dcfce7;
      color: #14532d;
      padding: 7px 11px;
      border-radius: 8px;
      border-left: 4px solid #15803d;
    }
    html[dir="rtl"] h4 {
      border-left: none;
      border-right: 4px solid #15803d;
    }
    .btn { padding: 7px 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
    .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
    .btn-primary { background: #15803d; color: #fff; width: 100%; padding: 10px; font-size: 14px; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-danger { background: #b91c1c; color: #fff; }
    .btn-edit { background: #0369a1; color: #fff; }
    .btn-approve { background: #15803d; color: #fff; flex: 1; }
    .btn-reject { background: #b91c1c; color: #fff; flex: 1; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 9px; border: 1px solid #15803d; background: #fff; color: #15803d; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #15803d; color: #fff; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; }
    .date-ltr { direction: ltr; text-align: left; }
    .date-preview { margin-top: 4px; font-size: 12px; color: #166534; font-weight: bold; direction: rtl; }
    .msg { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.error { display: block; background: #fee2e2; color: #991b1b; }
    .msg.success { display: block; background: #dcfce7; color: #166534; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 6px; }
    .menu-btn { padding: 13px 10px; border: 1px solid #bbf7d0; background: #f0fdf4; color: #14532d; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; transition: 0.15s ease; }
    .menu-btn.active { background: #15803d; color: #fff; border-color: #15803d; box-shadow: 0 3px 8px rgba(21,128,61,0.22); }
    .sub-window-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
    .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
    .sub-tab-btn { flex: 1; min-width: 90px; padding: 7px 9px; border: 1px solid #15803d; background: #f0fdf4; color: #14532d; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; }
    .sub-tab-btn.active { background: #15803d; color: #fff; }
    .entry-box { border: 1px solid #bbf7d0; background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    .member-total-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #14532d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .item-box { border: 1px solid #e2e8f0; border-radius: 10px; padding: 11px; margin-bottom: 8px; background: #f8fafc; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .item-box img.content-img { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin-top: 8px; cursor: pointer; }
    .img-fallback { margin-top: 6px; padding: 8px; background: #fef3c7; color: #92400e; border-radius: 6px; font-size: 12px; }
    .folder-tag { display: inline-block; background: #dcfce7; color: #166534; padding: 2px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .reply-box { margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: #eff6ff; border: 1px solid #bfdbfe; font-size: 13px; color: #1e3a8a; }
    .sub-section { border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 14px; }
    .req-actions { display: flex; gap: 8px; margin-top: 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #cbd5e1; padding: 7px; text-align: start; vertical-align: middle; }
    th { background: #f1f5f9; }
    .row-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .crop-editor-box {
      border: 1px solid #86efac;
      background: #f0fdf4;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      text-align: center;
      touch-action: none;
    }
    .crop-stage-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      touch-action: none;
    }
    .crop-circle-frame {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #15803d;
      background: #0f172a;
      position: relative;
      flex-shrink: 0;
      touch-action: none;
      cursor: grab;
    }
    .crop-circle-frame img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      max-width: none;
      max-height: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }
    .crop-hint {
      font-size: 12px;
      color: #166534;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 10px;
      touch-action: none;
    }
    .img-modal.open {
      display: flex;
    }
    .img-modal-box {
      position: relative;
      width: 100%;
      max-width: 98vw;
      max-height: 96vh;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }
    .img-modal-viewport {
      overflow: hidden;
      width: 100%;
      height: 76vh;
      max-height: 76vh;
      border-radius: 8px;
      background: #020617;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .img-modal-box img {
      display: block;
      max-width: 100%;
      max-height: 74vh;
      width: auto;
      height: auto;
      border-radius: 6px;
      transform-origin: 50% 50%;
      transition: transform 0.04s linear;
      touch-action: none;
      will-change: transform;
    }
    .img-modal-close {
      margin-top: 10px;
      align-self: center;
    }

</head>
<body class="no-select">

          <label id="lblLoginPass" for="loginPass">Password</label>
          <input id="loginPass" type="password" placeholder="Password" />
        </div>

          <label id="lblSelectAccountRole" for="loginAccountSelect">Select Account</label>
          <select id="loginAccountSelect"></select>
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary">Login</button>
      </div>

      <form id="registerForm" style="display:none;" novalidate>
        <div class="field">
          <label id="lblRegName" for="regName">Full Name</label>
          <input id="regName" type="text" placeholder="Full Name" />
        </div>
        <div class="field">
          <label id="lblRegPhone" for="regPhone">Phone Number</label>
          <input id="regPhone" type="tel" placeholder="03001234567" />
        </div>
        <div class="field">
          <label id="lblRegPass" for="regPass">Password</label>
          <input id="regPass" type="password" placeholder="At least 6 characters" />
        </div>
        <div class="field">
          <label id="lblRegConfirmPass" for="regConfirmPass">Confirm Password</label>
          <input id="regConfirmPass" type="password" placeholder="Re-enter password" />
        </div>
        <div class="field">
          <label id="lblRegRole" for="regRole">Account Type</label>
          <select id="regRole">
            <option id="optRoleSelect" value="">Select Type</option>
            <option id="optRolePublic" value="public">Public</option>
            <option id="optRoleMgmt" value="management">Management (Admin approval required)</option>
            <option id="optRoleAbroad" value="abroad">Abroad (Admin approval required)</option>
          </select>
        </div>
        <div class="field">
          <label id="lblRegPhoto" for="regPhotoInput">Profile Photo (Optional)</label>
          <input id="regPhotoInput" type="file" accept="image/*" />
          <div id="regCropEditor"></div>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary">Create Account</button>
      </form>

      <div id="authMsg" class="msg"></div>
    </div>

    <div id="portalCard" class="card" style="display:none;">
      <div class="top-bar">
        <div class="user-header-wrap">
          <img id="portalUserAvatar" class="avatar-sm" src="" alt="Profile" style="display:none;" />
          <div>
            <h3 id="portalUserName">User</h3>
            <div id="portalUserRole" style="font-size:12px; color:#475569;"></div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button type="button" id="portalLangBtn" class="btn btn-secondary">اردو</button>
          <button type="button" id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
      </div>

      <div id="roleMenu" class="menu-grid"></div>

      <div id="sectionWindow" style="display:none;">
        <div class="sub-window-bar">
          <h3 id="activeSectionTitle"></h3>
          <button type="button" id="backToMenuBtn" class="btn btn-sm btn-secondary">Back</button>
        </div>
        <div id="adminEntryArea" style="display:none;"></div>
        <div id="contentArea"></div>
      </div>

      <div id="adminMsg" class="msg"></div>
    </div>
  </div>

  <div id="imgPreviewModal" class="img-modal">
    <div class="img-modal-box">

    function todayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function parseDateParts(raw) {
      if (!raw) return null;
      const str = String(raw).trim();

      let m = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = m[2].padStart(2, "0");
        const dd = m[3].padStart(2, "0");
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      m = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, "0");
        const mm = m[2].padStart(2, "0");
        const yyyy = m[3];
        const ts = new Date(Number(yyyy), Number(mm) - 1, Number(dd)).getTime();
        return { dd, mm, yyyy, ts, iso: `${yyyy}-${mm}-${dd}` };
      }

      return null;
    }

    window.formatPurposeLabel = (rawPurpose) => {
      if (!rawPurpose) return "-";
      const lang = window.appState.lang || "en";
      const val = String(rawPurpose).trim();
      const matched = FUND_PURPOSES.find(
        (p) => p.id === val || p.ur === val || p.en.toLowerCase() === val.toLowerCase()
      );
      if (matched) return matched[lang] || matched.en;
      return val;
    };

    window.buildPurposeOptionsHtml = (selectedValue = "", includeEmpty = true) => {
      const lang = window.appState.lang || "en";
      const parts = [];
      if (includeEmpty) {
        parts.push(`<option value="">${window.t("selectPurposePlaceholder")}</option>`);
      }

      const selTrim = String(selectedValue || "").trim();
      const matchedExisting = FUND_PURPOSES.find(
        (p) => p.id === selTrim || p.ur === selTrim || p.en.toLowerCase() === selTrim.toLowerCase()
      );

      FUND_PURPOSES.forEach((p) => {
        const isSelected = matchedExisting && matchedExisting.id === p.id ? " selected" : "";
        const label = p[lang] || p.en;
        parts.push(`<option value="${p.id}"${isSelected}>${label}</option>`);
      });

      if (selTrim && !matchedExisting) {
        const escaped = selTrim.replace(/"/g, "&quot;");
        parts.push(`<option value="${escaped}" selected>${selTrim}</option>`);
      }

      return parts.join("");
    };

    window.normalizeFundRecord = (f) => {
      let rawDate = f.date || "";
      let purpose = f.purpose || "";

      if (!rawDate && f.note) {
        const parsedNoteDate = parseDateParts(f.note);
        if (parsedNoteDate) {
          rawDate = f.note;
        } else if (!purpose) {
          purpose = f.note;
        }
      }

      const parsed = parseDateParts(rawDate);
      return {
        ...f,
        date: parsed ? parsed.iso : rawDate,
        purpose,
        _ts: parsed ? parsed.ts : 0
      };
    };

    window.formatDDMMYYYY = (rawDate) => {
      const p = parseDateParts(rawDate);
      if (p) {
        return `<span dir="ltr">${p.dd}/${p.mm}/${p.yyyy}</span>`;
      }
      return rawDate ? `<span dir="ltr">${rawDate}</span>` : `<span dir="ltr">-</span>`;
    };

    window.dateSortValue = (item) => {
      if (typeof item._ts === "number" && item._ts > 0) return item._ts;
      const p = parseDateParts(item && (item.date || item.folder));
      if (p && !Number.isNaN(p.ts)) return p.ts;
      if (item && item.createdAt && typeof item.createdAt.toMillis === "function") {
        return item.createdAt.toMillis();
      }
      return 0;
    };

      const u = String(rawUrl || "").trim();
      if (!u) return "";
      const driveMatch = u.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
      }
      return u;
    };

      });
    }

    function createAvatarCropController(containerId, fileInputId) {
      const host = el(containerId);
      const fileInp = el(fileInputId);
      const FRAME_SIZE = 190;

      let sourceImg = null;
      let baseScale = 1;
      let scale = 1;
      let minScale = 1;
      let maxScale = 4;
      let tx = 0;
      let ty = 0;

      let dragActive = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragBaseTx = 0;
      let dragBaseTy = 0;

      let pinchActive = false;
      let pinchStartDist = 0;
      let pinchStartScale = 1;
      let pinchAnchorImgX = 0;
      let pinchAnchorImgY = 0;

      function clampPosition() {
        if (!sourceImg) return;
        const w = sourceImg.naturalWidth * scale;
        const h = sourceImg.naturalHeight * scale;
        if (w <= FRAME_SIZE) {
          tx = (FRAME_SIZE - w) / 2;
        } else {
          tx = Math.min(0, Math.max(FRAME_SIZE - w, tx));
        }
        if (h <= FRAME_SIZE) {
          ty = (FRAME_SIZE - h) / 2;
        } else {
          ty = Math.min(0, Math.max(FRAME_SIZE - h, ty));
        }
      }

      function applyImageStyle(imgEl) {
        if (!imgEl || !sourceImg) return;
        clampPosition();
        imgEl.style.width = `${sourceImg.naturalWidth}px`;
        imgEl.style.height = `${sourceImg.naturalHeight}px`;
        imgEl.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0) scale(${scale.toFixed(4)})`;
      }

      function computeInitialPlacement() {
        if (!sourceImg) return;
        const nw = sourceImg.naturalWidth || sourceImg.width || 1;
        const nh = sourceImg.naturalHeight || sourceImg.height || 1;
        baseScale = Math.max(FRAME_SIZE / nw, FRAME_SIZE / nh);
        minScale = baseScale;
        maxScale = baseScale * 4;
        scale = baseScale;
        const w = nw * scale;
        const h = nh * scale;
        tx = (FRAME_SIZE - w) / 2;
        ty = 0;
        clampPosition();
      }

      function renderEditor(srcUrl) {
        if (!host) return;
        if (!srcUrl || !sourceImg) {
          host.innerHTML = "";
          return;
        }
        host.innerHTML = `
          <div class="crop-editor-box">
            <div class="crop-hint">${window.t("cropTouchHint")}</div>
            <div class="crop-stage-wrap">
              <div class="crop-circle-frame" data-crop-frame>
                <img data-crop-img src="${srcUrl}" alt="Profile Touch Adjust" />
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-secondary" data-crop-reset>${window.t("resetCropBtn")}</button>
          </div>`;

        const frame = host.querySelector("[data-crop-frame]");
        const imgEl = host.querySelector("[data-crop-img]");
        const resetBtn = host.querySelector("[data-crop-reset]");

        applyImageStyle(imgEl);

        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            computeInitialPlacement();
            applyImageStyle(imgEl);
          });
        }

        if (!frame) return;

        const dist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

        frame.addEventListener("touchstart", (e) => {
          if (!sourceImg) return;
          const rect = frame.getBoundingClientRect();
          if (e.touches.length === 2) {
            e.preventDefault();
            dragActive = false;
            pinchActive = true;
            pinchStartDist = dist(e.touches[0], e.touches[1]);
            pinchStartScale = scale;
            const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
            const midY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
            pinchAnchorImgX = (midX - tx) / scale;
            pinchAnchorImgY = (midY - ty) / scale;
          } else if (e.touches.length === 1) {
            e.preventDefault();
            pinchActive = false;
            dragActive = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            dragBaseTx = tx;
            dragBaseTy = ty;
          }
        }, { passive: false });

        frame.addEventListener("touchmove", (e) => {
          if (!sourceImg) return;
          const rect = frame.getBoundingClientRect();
          if (e.touches.length === 2 && pinchActive && pinchStartDist > 0) {
            e.preventDefault();
            const curDist = dist(e.touches[0], e.touches[1]);
            const nextScale = Math.min(maxScale, Math.max(minScale, pinchStartScale * (curDist / pinchStartDist)));
            const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
            const midY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
            scale = nextScale;
            tx = midX - pinchAnchorImgX * scale;
            ty = midY - pinchAnchorImgY * scale;
            applyImageStyle(imgEl);
          } else if (e.touches.length === 1 && dragActive) {
            e.preventDefault();
            tx = dragBaseTx + (e.touches[0].clientX - dragStartX);
            ty = dragBaseTy + (e.touches[0].clientY - dragStartY);
            applyImageStyle(imgEl);
          }
        }, { passive: false });

        frame.addEventListener("touchend", (e) => {
          if (e.touches.length < 2) {
            pinchActive = false;
            pinchStartDist = 0;
          }
          if (e.touches.length === 0) {
            dragActive = false;
          } else if (e.touches.length === 1) {
            dragActive = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            dragBaseTx = tx;
            dragBaseTy = ty;
          }
        });

        frame.addEventListener("mousedown", (e) => {
          if (!sourceImg || e.button !== 0) return;
          e.preventDefault();
          dragActive = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          dragBaseTx = tx;
          dragBaseTy = ty;
        });

        window.addEventListener("mousemove", (e) => {
          if (!dragActive || !sourceImg) return;
          tx = dragBaseTx + (e.clientX - dragStartX);
          ty = dragBaseTy + (e.clientY - dragStartY);
          applyImageStyle(imgEl);
        });

        window.addEventListener("mouseup", () => {
          dragActive = false;
        });

        frame.addEventListener("wheel", (e) => {
          if (!sourceImg) return;
          e.preventDefault();
          const rect = frame.getBoundingClientRect();
          const px = e.clientX - rect.left;
          const py = e.clientY - rect.top;
          const anchorX = (px - tx) / scale;
          const anchorY = (py - ty) / scale;
          const factor = e.deltaY < 0 ? 1.12 : 0.89;
          scale = Math.min(maxScale, Math.max(minScale, scale * factor));
          tx = px - anchorX * scale;
          ty = py - anchorY * scale;
          applyImageStyle(imgEl);
        }, { passive: false });
      }

      if (fileInp) {
        fileInp.addEventListener("change", async () => {
          const file = fileInp.files && fileInp.files[0];
          if (!file) {
            sourceImg = null;
            renderEditor("");
            return;
          }
          try {
            const rawDataUrl = await readRawFileAsDataUrl(file);
            const img = new Image();
            img.onload = () => {
              sourceImg = img;
              computeInitialPlacement();
              renderEditor(rawDataUrl);
            };
            img.src = rawDataUrl;
          } catch (e) {
            sourceImg = null;
            renderEditor("");
          }
        });
      }

      return {
        hasImage: () => Boolean(sourceImg),
        reset: () => {
          sourceImg = null;
          dragActive = false;
          pinchActive = false;
          if (fileInp) fileInp.value = "";
          renderEditor("");
        },
        exportCroppedDataUrl: (outputSize = 360, quality = 0.78) => {
          if (!sourceImg) return "";
          const canvas = document.createElement("canvas");
          canvas.width = outputSize;
          canvas.height = outputSize;
          const ctx = canvas.getContext("2d");

          const ratio = outputSize / FRAME_SIZE;
          const srcX = Math.max(0, -tx / scale);
          const srcY = Math.max(0, -ty / scale);
          const srcW = Math.min(sourceImg.naturalWidth - srcX, FRAME_SIZE / scale);
          const srcH = Math.min(sourceImg.naturalHeight - srcY, FRAME_SIZE / scale);

          const dstX = Math.max(0, tx * ratio);
          const dstY = Math.max(0, ty * ratio);
          const dstW = srcW * scale * ratio;
          const dstH = srcH * scale * ratio;

          ctx.clearRect(0, 0, outputSize, outputSize);
          ctx.drawImage(sourceImg, srcX, srcY, srcW, srcH, dstX, dstY, dstW, dstH);
          return canvas.toDataURL("image/jpeg", quality);
        }
      };
    }

    function isUserActivelyTyping() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName ? active.tagName.toUpperCase() : "";
      if (tag === "TEXTAREA" || tag === "SELECT") return true;
      if (tag === "INPUT") {
        const type = (active.type || "text").toLowerCase();
        if (["text", "number", "password", "tel", "url", "email", "search", "date"].includes(type)) {
          return Boolean(active.value && active.value.trim().length > 0) || document.activeElement === active;
        }

      return false;
    }

    const imgModal = el("imgPreviewModal");
    const imgModalViewport = el("imgModalViewport");
    const imgModalTag = el("imgPreviewTag");
    const imgModalTitle = el("imgPreviewTitle");
    const closeImgModalBtn = el("closeImgModalBtn");

    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let panStartX = 0;
    let panStartY = 0;
    let panBaseX = 0;
    let panBaseY = 0;
    let isOneFingerPanning = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let lastTapTime = 0;

    function clampPan() {
      if (zoomScale <= 1 || !imgModalTag || !imgModalViewport) {
        panX = 0;
        panY = 0;
        return;
      }
      const baseW = imgModalTag.offsetWidth || imgModalViewport.clientWidth;
      const baseH = imgModalTag.offsetHeight || imgModalViewport.clientHeight;
      const maxPanX = Math.max(40, ((baseW * zoomScale) - imgModalViewport.clientWidth) * 0.65);
      const maxPanY = Math.max(40, ((baseH * zoomScale) - imgModalViewport.clientHeight) * 0.65);
      panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
      panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
    }

    function applyImageTransform() {
      if (!imgModalTag) return;
      if (zoomScale <= 1) {
        zoomScale = 1;
        panX = 0;
        panY = 0;
        imgModalTag.style.transformOrigin = "50% 50%";
        imgModalTag.style.transform = "translate3d(0px, 0px, 0) scale(1)";
      } else {
        clampPan();
        imgModalTag.style.transform = `translate3d(${panX.toFixed(1)}px, ${panY.toFixed(1)}px, 0) scale(${zoomScale})`;
      }
    }

    function setZoomAtPoint(nextScale, clientX, clientY) {
      zoomScale = Math.min(4, Math.max(1, Number(nextScale.toFixed(2))));
      if (!imgModalTag) return;

      if (typeof clientX === "number" && typeof clientY === "number") {
        const rect = imgModalTag.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const ox = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
          const oy = Math.min(100, Math.max(0, ((clientY - rect.top) / rect.height) * 100));
          imgModalTag.style.transformOrigin = `${ox.toFixed(1)}% ${oy.toFixed(1)}%`;
        }
      }

      if (zoomScale <= 1) {
        panX = 0;
        panY = 0;
      }
      applyImageTransform();
    }

    function getTouchDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }

    function getTouchMidpoint(t1, t2) {
      return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
      };
    }

    function resetImageViewerState() {
      zoomScale = 1;
      panX = 0;
      panY = 0;
      panStartX = 0;
      panStartY = 0;
      panBaseX = 0;
      panBaseY = 0;
      isOneFingerPanning = false;
      pinchStartDist = 0;
      pinchStartScale = 1;
      applyImageTransform();
    }

    function closeImageModal() {
      if (!imgModal) return;
      resetImageViewerState();
      if (imgModalTag) imgModalTag.src = "";
      imgModal.classList.remove("open");
    }

    if (imgModalViewport) {
      imgModalViewport.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          isOneFingerPanning = false;
          pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
          pinchStartScale = zoomScale;
          const mid = getTouchMidpoint(e.touches[0], e.touches[1]);
          setZoomAtPoint(zoomScale, mid.x, mid.y);
        } else if (e.touches.length === 1) {
          const now = Date.now();
          const t = e.touches[0];
          if (now - lastTapTime < 300) {
            e.preventDefault();
            isOneFingerPanning = false;
            setZoomAtPoint(zoomScale > 1 ? 1 : 2.2, t.clientX, t.clientY);
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;

          if (zoomScale > 1) {
            e.preventDefault();
            isOneFingerPanning = true;
            panStartX = t.clientX;
            panStartY = t.clientY;
            panBaseX = panX;
            panBaseY = panY;
          }
        }
      }, { passive: false });

      imgModalViewport.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          e.preventDefault();
          const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
          const ratio = currentDist / pinchStartDist;
          const mid = getTouchMidpoint(e.touches[0], e.touches[1]);
          setZoomAtPoint(pinchStartScale * ratio, mid.x, mid.y);
        } else if (e.touches.length === 1 && isOneFingerPanning && zoomScale > 1) {
          e.preventDefault();
          const t = e.touches[0];
          panX = panBaseX + (t.clientX - panStartX);
          panY = panBaseY + (t.clientY - panStartY);
          applyImageTransform();
        }
      }, { passive: false });

      imgModalViewport.addEventListener("touchend", (e) => {
        if (e.touches.length < 2) {
          pinchStartDist = 0;
          pinchStartScale = zoomScale;
        }
        if (e.touches.length === 0) {
          isOneFingerPanning = false;
        } else if (e.touches.length === 1 && zoomScale > 1) {
          const t = e.touches[0];
          isOneFingerPanning = true;
          panStartX = t.clientX;
          panStartY = t.clientY;
          panBaseX = panX;
          panBaseY = panY;
        }
      });
    }

    function fileToDataUrl(file, maxW = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxW ? maxW / img.width : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = () => resolve(reader.result);
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function getAccountsForPhone(phone) {
      const results = [];
      const seenIds = new Set();

      const qSnap = await getDocs(query(collection(db, "users"), where("phone", "==", phone)));
      qSnap.forEach((d) => {
        if (!seenIds.has(d.id)) {
          seenIds.add(d.id);
          results.push({ id: d.id, ...d.data() });
        }
      });

      const legacySnap = await getDoc(doc(db, "users", phone));
      if (legacySnap.exists() && !seenIds.has(legacySnap.id)) {
        seenIds.add(legacySnap.id);
        results.push({ id: legacySnap.id, ...legacySnap.data() });
      }

      return results;
    }

    function bindDeleteButtons(container, colName, refreshFn) {
      if (!isAdminUser()) return;
      container.querySelectorAll("[data-del-col]").forEach((btn) => {

          if (!isAdminUser()) {
            return window.showAdminMsg(window.t("adminOnlyActionError"), "error");

          if (!confirm(window.t("confirmDelete"))) return;
          try {
            await deleteDoc(doc(db, btn.dataset.delCol, btn.dataset.delId));
            window.showAdminMsg(window.t("deletedMsg"), "success");
            if (refreshFn) await refreshFn();
          } catch (err) {
            window.showAdminMsg(err && err.message ? err.message : "Delete failed", "error");
          }
        });
      });
    }

    function bindImageFallbacks(container) {
      container.querySelectorAll("img[data-img-item]").forEach((img) => {
        img.addEventListener("error", () => {
          const fallback = img.parentElement.querySelector(".img-fallback");
          img.style.display = "none";
          if (fallback) fallback.style.display = "block";
        });
      });
    }

    function renderMediaBlock(item, isVideo) {
      const rawSrc = item.src || "";
      if (!rawSrc) return "";

      if (isVideo) {
        if (window.isSafeExternalUrl(rawSrc)) {
          return `<div class="row-actions"><a class="btn btn-sm btn-secondary" href="${rawSrc}" target="_blank" rel="noopener noreferrer">${window.t("openVideo")}</a></div>`;
        }
        return "";
      }

      const directImg = window.toDirectImageUrl(rawSrc);
      const openBtn = window.isSafeExternalUrl(rawSrc)
        ? `<a class="btn btn-sm btn-secondary" href="${rawSrc}" target="_blank" rel="noopener noreferrer">${window.t("openLink")}</a>`
        : "";

      return `
        <img class="content-img" data-img-item src="${directImg}" alt="${(item.title || "").replace(/"/g, "&quot;")}" />

          <div>${window.t("imgNotDirect")}</div>

    async function renderFundsAndMembersDetails(area) {
      const usersSnap = await getDocs(collection(db, "users"));

      const allMembers = [];
      usersSnap.forEach((d) => {

      const abroadList = allMembers.filter((m) => m.role === "abroad");
      const publicList = allMembers.filter((m) => m.role === "public");

      if (!validGroups.includes(window.appState.activeMemberGroup)) {

        const mName = memberNamesMap[mKey] || mKey || "-";

      allFundItems.sort((a, b) => window.dateSortValue(b) - window.dateSortValue(a));

      const roleText = (r) => r === "abroad"

      const membersTableHtml = !groupMembers.length
        ? `<div class='item-box'>${window.t("noMembersFound")}</div>`

          <div class="table-wrap">

              <thead>
                <tr>
                  <th>${window.t("colMember")}</th>

              <label>${window.t("lblFundPurpose")}</label>
              <select id="editFundPurpose">${window.buildPurposeOptionsHtml(item.purpose || "", false)}</select>
            </div>
            <div class="row-actions">

            </div>`;

    async function renderComplaintsSection(area) {
      const u = window.appState.currentUser;
      const l = window.appState.lang;
      if (!u) return;

      if (!isAdminUser()) {
        const q = query(collection(db, "complaints"), where("memberPhone", "==", u.phone));
        const snap = await getDocs(q);
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => {
          const ta = a.createdAt && typeof a.createdAt.toMillis === "function" ? a.createdAt.toMillis() : 0;
          const tb = b.createdAt && typeof b.createdAt.toMillis === "function" ? b.createdAt.toMillis() : 0;
          return tb - ta;
        });

        const itemsHtml = !list.length
          ? `<div class="item-box">${window.t("noComplaints")}</div>`
          : list.map((c) => `
            <div class="item-box">

                <strong>${c.subject || ""}</strong>
                <span class="folder-tag">${window.formatDDMMYYYY(c.date)}</span>

                <strong>${window.t("lblAdminReply")}:</strong>

            <h4>${window.t("complaintSectionTitle")}</h4>

        el("submitComplaintBtn").addEventListener("click", async () => {

          if (!subject || !message) {
            return window.showAdminMsg(
              l === "en" ? "Please enter subject and complaint details." : "براہِ کرم موضوع اور شکایت کی تفصیل لکھیں۔",

            );

          el("submitComplaintBtn").disabled = true;

      const usersSnap = await getDocs(collection(db, "users"));
      memberNamesMap = {};

        const mu = d.data();
        memberNamesMap[mu.phone] = mu.name;
        if (mu.photoUrl) memberPhotosMap[mu.phone] = mu.photoUrl;
      });

      const snap = await getDocs(collection(db, "complaints"));
      const complaints = [];
      snap.forEach((d) => complaints.push({ id: d.id, ...d.data() }));
      complaints.sort((a, b) => {
        const ta = a.createdAt && typeof a.createdAt.toMillis === "function" ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && typeof b.createdAt.toMillis === "function" ? b.createdAt.toMillis() : 0;

        const avatarHtml = mPhoto
          ? `<img class="avatar-sm" src="${mPhoto}" alt="${mName.replace(/"/g, "&quot;")}" />`
          : "";
        return `
          <div class="item-box">
            <div class="item-top">
              <div class="user-header-wrap">
                ${avatarHtml}
                <div>
                  <div><strong>${mName}</strong> <span style="font-size:12px; color:#475569;">(${c.memberPhone || ""})</span></div>

              <label>${window.t("lblAdminReply")}</label>
              <textarea rows="2" data-reply-input="${c.id}" placeholder="${window.t("lblAdminReply")}">${c.adminReply || ""}</textarea>

      area.querySelectorAll("[data-save-reply]").forEach((btn) => {

            window.showAdminMsg(window.t("replySavedMsg"), "success");
          } catch (err) {
            window.showAdminMsg(err && err.message ? err.message : "Failed to save reply", "error");
          } finally {
            btn.disabled = false;
          }
        });
      });

      bindDeleteButtons(area, "complaints", () => renderComplaintsSection(area));
    }

    window.appState.handlers.loginUser = async (phone, password, selectedDocId = "") => {
      const l = window.appState.lang;
      if (!db) return window.showAuthMsg(l === "en" ? "Database connection unavailable." : "ڈیٹا بیس سے رابطہ ممکن نہیں۔", "error");
      el("loginBtn").disabled = true;
      try {
        const accounts = await getAccountsForPhone(phone);
        if (!accounts.length) {
          return window.showAuthMsg(l === "en" ? "Account not found." : "اکاؤنٹ نہیں ملا۔", "error");
        }

        const matched = accounts.filter((acc) => acc.password === password);
        if (!matched.length) {
          return window.showAuthMsg(l === "en" ? "Incorrect password." : "پاس ورڈ غلط ہے۔", "error");
        }

        let targetUser = matched[0];
        if (matched.length > 1) {
          const chosen = matched.find((acc) => acc.id === selectedDocId);
          if (!chosen) {
            const picker = el("multiAccountPicker");
            const sel = el("loginAccountSelect");
            sel.innerHTML = matched.map((acc) => {
              const roleText = acc.role === "abroad"
                ? window.t("roleAbroadLabel")
                : acc.role === "management"
                  ? window.t("roleMgmtLabel")
                  : window.t("rolePublicLabel");
              return `<option value="${acc.id}">${roleText} - ${acc.name}</option>`;
            }).join("");
            picker.style.display = "block";
            return window.showAuthMsg(window.t("chooseAccountToLogin"), "error");
          }
          targetUser = chosen;
        }

        if ((targetUser.role === "management" || targetUser.role === "abroad") && targetUser.status === "pending_approval") {
          return window.showAuthMsg(l === "en" ? "Your account is awaiting Admin approval." : "آپ کا اکاؤنٹ ابھی ایڈمن کی منظوری کے منتظر ہے۔", "error");
        }
        if (targetUser.status === "rejected") {
          return window.showAuthMsg(l === "en" ? "Your account request was rejected." : "آپ کی اکاؤنٹ کی درخواست مسترد کر دی گئی ہے۔", "error");
        }

        window.appState.currentUser = targetUser;
        window.saveUserSession(targetUser);
        window.openPortal();
      } catch (err) {
        window.showAuthMsg(err && err.message ? err.message : "Error", "error");
      } finally {
        el("loginBtn").disabled = false;
      }
    };

      if (!name) return window.showAuthMsg(l === "en" ? "Please enter your full name." : "براہِ کرم پورا نام لکھیں۔", "error");
      if (!window.isValidPhone(phone)) return window.showAuthMsg(l === "en" ? "Enter a valid phone number (e.g. 03001234567)." : "درست فون نمبر لکھیں (مثلاً 03001234567)۔", "error");
      if (phone === BUILT_IN_ADMIN.phone) return window.showAuthMsg(l === "en" ? "This number is reserved for Admin." : "یہ نمبر ایڈمن کے لیے محفوظ ہے۔", "error");
      if (password.length < 6) return window.showAuthMsg(l === "en" ? "Password must be at least 6 characters." : "پاس ورڈ کم از کم 6 حروف کا ہو۔", "error");
      if (!confirmPassword || password !== confirmPassword) return window.showAuthMsg(window.t("passMismatch"), "error");
      if (!role) return window.showAuthMsg(l === "en" ? "Please select an account type." : "براہِ کرم اکاؤنٹ کی قسم منتخب کریں۔", "error");

      el("registerBtn").disabled = true;
      try {
        const existingAccounts = await getAccountsForPhone(phone);

        if (role === "public" && existingAccounts.length > 0) {
          return window.showAuthMsg(window.t("publicNotAllowedExisting"), "error");
        }

        if (existingAccounts.some((acc) => acc.role === role)) {
          return window.showAuthMsg(window.t("roleAlreadyExists"), "error");
        }

        let photoUrl = "";
        if (regCropCtrl && regCropCtrl.hasImage()) {
          photoUrl = regCropCtrl.exportCroppedDataUrl(360, 0.78);
        } else {
          const fileInp = el("regPhotoInput");
          const file = fileInp && fileInp.files ? fileInp.files[0] : null;
          if (file) photoUrl = await fileToDataUrl(file, 480, 0.72);
        }

        const docId = `${phone}_${role}`;
        const ref = doc(db, "users", docId);
        const needsApproval = role === "management" || role === "abroad";

        await setDoc(ref, {
          name,
          phone,
          password,
          role,
          photoUrl,
          status: needsApproval ? "pending_approval" : "active",
          createdAt: serverTimestamp()
        });

        el("registerForm").reset();
        if (regCropCtrl) regCropCtrl.reset();
        el("tabLogin").click();
        el("loginPhone").value = phone;
        el("multiAccountPicker").style.display = "none";
        window.showAuthMsg(
          needsApproval
            ? (l === "en" ? "Account created! You can log in after Admin approval." : "اکاؤنٹ بن گیا! ایڈمن کی منظوری کے بعد آپ لاگ ان کر سکیں گے۔")
            : (l === "en" ? "Public account created! You can log in now." : "عوام اکاؤنٹ بن گیا! اب آپ لاگ ان کر سکتے ہیں۔"),
          "success"
        );
      } catch (err) {
        window.showAuthMsg(err && err.message ? err.message : "Error", "error");
      } finally {
        el("registerBtn").disabled = false;
      }
    });

    async function restoreOrRefreshSession({ forceOpenPortal = false } = {}) {
      const saved = window.loadSavedSession ? window.loadSavedSession() : null;
      if (!saved || !db) return;

      if (saved.role === "admin" && saved.phone === BUILT_IN_ADMIN.phone) {
        const wasAlreadyOpen = Boolean(window.appState.currentUser);
        const prevSection = window.appState.activeSection;
        window.appState.currentUser = {
          ...saved,
          photoUrl: saved.photoUrl || getCachedAdminPhoto()
        };
        if (!wasAlreadyOpen || forceOpenPortal) {
          window.openPortal();
        } else {
          window.updatePortalHeader();
          if (prevSection && window.appState.handlers.selectSection) {
            await window.appState.handlers.selectSection(prevSection, { silent: true });
          }
        }
        if (window.appState.handlers.syncAdminProfile) {
          await window.appState.handlers.syncAdminProfile();
        }
        return;
      }

      try {
        const accounts = await getAccountsForPhone(saved.phone);
        const matchedAcc = accounts.find((acc) =>
          acc.role === saved.role && acc.status === "active"
        );

        if (matchedAcc) {
          const wasAlreadyOpen = Boolean(window.appState.currentUser);
          const prevSection = window.appState.activeSection;
          window.appState.currentUser = matchedAcc;
          window.saveUserSession(matchedAcc);
          if (!wasAlreadyOpen || forceOpenPortal) {
            window.openPortal();
          } else {
            window.updatePortalHeader();
            if (prevSection && window.appState.handlers.selectSection) {
              await window.appState.handlers.selectSection(prevSection, { silent: true });
            }
          }
        } else if (saved.role === "public" && saved.status === "active") {
          const pubAcc = accounts.find((acc) => acc.role === "public" && acc.status !== "rejected");
          if (pubAcc) {
            const wasAlreadyOpen = Boolean(window.appState.currentUser);
            const prevSection = window.appState.activeSection;
            window.appState.currentUser = pubAcc;
            window.saveUserSession(pubAcc);
            if (!wasAlreadyOpen || forceOpenPortal) {
              window.openPortal();
            } else {
              window.updatePortalHeader();
              if (prevSection && window.appState.handlers.selectSection) {
                await window.appState.handlers.selectSection(prevSection, { silent: true });
              }
            }
          } else {
            window.saveUserSession(null);
          }
        } else {
          window.saveUserSession(null);
        }
      } catch (e) {
        if (!window.appState.currentUser) {
          window.appState.currentUser = saved;
          window.openPortal();
        }
      }
    }

    window.appState.handlers.refreshOnReopen = async () => {
      if (!window.loadSavedSession || !window.loadSavedSession()) return;
      await restoreOrRefreshSession({ forceOpenPortal: false });
    };

    restoreOrRefreshSession({ forceOpenPortal: false });
  </script>
</body>
</html>
